<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Hydee writes</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#8b5a2b"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600&family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,600;1,500&family=Lora:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@600&family=Courier+Prime&family=Nunito:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--fg:#3b2530;--mut:#9a7b88;--card:#fff5f8;--bd:#f3d9e1;--ac:#b0587a;--hl:#fde8ef;--desk:#fbeef3;--br:#8b5a2b;--ef:Merriweather,Georgia,serif;--sz:18px;--lh:1.8;--ps:0em;--dim:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#2b2c30;--fg:#e8e8ea;--mut:#a79d94;--card:#36373c;--bd:#46474d;--ac:#e8a0bb;--hl:#40303a;--br:#f0b88a;--desk:#232427}}
:root[data-theme=dark]{--bg:#2b2c30;--fg:#e8e8ea;--mut:#a79d94;--card:#36373c;--bd:#46474d;--ac:#e8a0bb;--hl:#40303a;--br:#f0b88a;--desk:#232427}
:root[data-theme=pitch]{--bg:#000000;--fg:#f2f2f2;--mut:#777777;--card:#111111;--bd:#262626;--ac:#ffffff;--hl:#1c1c1e;--desk:#050505;--br:#f0b88a}
:root[data-theme=sepia]{--bg:#f6ecdc;--fg:#3b2a1a;--mut:#8a7258;--card:#efe1cb;--bd:#dcc8a8;--ac:#7a4a1f;--hl:#e8d5b5;--desk:#e6d6bb;--br:#7a4a1f}
:root[data-theme=blush]{--bg:#fff3f6;--fg:#4a2433;--mut:#a67a8b;--card:#ffe8ef;--bd:#f6cddb;--ac:#c2456f;--hl:#fcd9e4;--desk:#f9d3e0;--br:#8b4a3a}
:root[data-theme=lilac]{--bg:#faf6ff;--fg:#33264a;--mut:#8b7aa8;--card:#f0e8fc;--bd:#e0d2f5;--ac:#8a5cc4;--hl:#eadcfb;--desk:#e6d9f8;--br:#6d4a9c}
:root[data-theme=mint]{--bg:#f6fffb;--fg:#1f3a30;--mut:#6f9585;--card:#e4f7ee;--bd:#cdebdc;--ac:#3f9d7a;--hl:#d5f2e5;--desk:#d3efe2;--br:#2f6f58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--hl),var(--bg) 260px) no-repeat var(--bg);color:var(--fg);font:16px Inter,system-ui,sans-serif;-webkit-user-select:auto;user-select:auto}
#dim-ov{position:fixed;inset:0;background:#000;pointer-events:none;z-index:99999;opacity:var(--dim,0)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:4px;padding:8px 12px;background:linear-gradient(90deg,var(--hl),var(--bg));border-bottom:2px solid var(--ac)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:28px;margin:0;flex:1;color:var(--ac);font-family:'Dancing Script','Playfair Display',Georgia,cursive;font-weight:600}.sp{flex:1}
button{font:inherit;color:var(--fg);background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
button:hover{background:var(--hl)}
main{padding:14px;max-width:900px;margin:auto}
.sync-badge{font-size:11px;padding:3px 9px;border-radius:12px;background:var(--hl);color:var(--ac);font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;user-select:none}
.search-row{display:flex;gap:8px;padding:0 14px 10px;max-width:900px;margin:auto}
.search-row input{flex:1;padding:9px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--fg);font:inherit;outline:0}
.search-row button{padding:6px 14px;background:var(--ac);color:#fff;border-radius:20px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cd{border:1px solid var(--bd);border-top:5px solid var(--c,var(--ac));border-radius:18px;background:var(--card);overflow:hidden;cursor:pointer;box-shadow:0 3px 12px #b0587a24}
.pv{height:120px;padding:10px;font:11px/1.4 var(--ef);color:var(--mut);overflow:hidden;background:var(--bg);margin:8px 8px 0;border-radius:6px}
.ct{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 12px;gap:4px}
.ct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .cd{display:flex;align-items:center;margin-bottom:8px}.list .pv{display:none}.list .ct{flex:1}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#e58fb0);color:#fff;font-size:26px;box-shadow:0 4px 14px #0004}
.fab:hover{background:var(--ac)}.em{color:var(--mut);text-align:center;margin-top:60px}
#ed{max-width:720px;margin:0 auto 90px;padding:28px 26px 60px;min-height:70vh;outline:0;background:var(--bg);border-radius:6px;box-shadow:0 2px 18px #5a3a1a26;font-family:var(--ef);font-size:var(--sz);line-height:var(--lh);-webkit-user-select:text;user-select:text}
#ed{text-indent:var(--ind,1.6em)}#ed p,#ed div{margin:0 0 var(--ps)}
#sh{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
#sh[hidden]{display:none}.bk{position:absolute;inset:0;background:#0007}
.bx{position:relative;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;max-width:600px;width:100%;margin:auto auto 0}
.bx h3{margin:0 0 10px}.bx>button{display:block;width:100%;text-align:left;padding:13px 10px}
.bx input[type=text]{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
.bx input[type=range]{width:100%}.bx label{display:block;margin-top:10px;color:var(--mut);font-size:14px}
.bx select{width:100%;padding:10px;border-radius:8px;background:var(--card);color:var(--fg);border:1px solid var(--bd);font:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px}.p,.on{background:var(--ac);color:#fff}
.tb{display:flex;align-items:center}.tb>span{flex:1;overflow:hidden;text-overflow:ellipsis}.cur{background:var(--hl);border-radius:10px;color:var(--ac)}
.bar{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:6;display:flex;align-items:center;gap:4px;padding:6px 8px calc(6px + var(--sb,0px));background:var(--hl);border-top:1px solid var(--bd);overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar button{background:var(--bg);border:1px solid var(--bd);min-width:36px;height:36px;padding:0 8px;color:var(--ac);font-weight:700;flex:none;border-radius:6px;font-size:14px}
.bar button:hover{background:var(--ac);color:#fff}
.desk{background:var(--desk);position:fixed;left:0;right:0;top:calc(54px + env(safe-area-inset-top,0px));bottom:calc(var(--kb,0px) + 50px + var(--sb,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 10px 30vh}body.ed{overflow:hidden}
.cm{background:#ffe59a99;border-bottom:2px solid #e0a800;border-radius:3px;cursor:pointer}
#ed h1,#ed h2,#ed h3{text-indent:0;color:var(--br);font-family:'Playfair Display',Georgia,serif;margin:.8em 0 .5em;line-height:1.3}#ed h1{font-size:1.7em;text-align:center}#ed h2{font-size:1.3em}#ed h3{font-size:1.1em;font-style:italic}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mg button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:14px;font-size:13px;background:var(--hl);border:1px solid var(--bd);font-weight:600}.mg button span{font-size:19px}
.pg{max-width:720px;margin:0 auto;background:var(--bg);border-radius:22px;box-shadow:0 4px 24px #b0587a26;padding:34px 26px 40px}
.pg #ed{background:none;box-shadow:none;padding:0;margin:0;min-height:50vh;border-radius:0}
.chn{text-align:center;font:600 62px 'Playfair Display',Georgia,serif;color:var(--ac);opacity:.45;line-height:1;margin-bottom:10px}
.cht{text-align:center;font:600 30px 'Playfair Display',Georgia,serif;color:var(--br);outline:0;margin:6px 0 28px;line-height:1.25;min-height:1.25em}
.cht:empty::before{content:attr(data-ph);color:var(--mut);opacity:.6;font-weight:400}
#ed.emp p:first-child::before{content:'Begin your story here…';color:var(--mut);opacity:.7;font-style:italic;text-indent:0}
#sh.side{flex-direction:row;justify-content:flex-start}#sh.side .bx{margin:0;width:84%;max-width:330px;height:100%;max-height:none;border-radius:0 26px 26px 0;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.st{display:flex;align-items:baseline;gap:10px;padding:10px 14px;margin:8px 0;background:var(--hl);border-radius:16px}.st b{font:600 26px 'Playfair Display',Georgia,serif;color:var(--ac)}.st span{color:var(--mut);font-size:14px}
.cr{display:grid;gap:10px}.cr button{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,var(--a),var(--b));color:#3b2530;border:0}.cr b{display:block;font-size:17px}.cr i{font-size:13px;opacity:.75;font-style:normal}
.hd2{flex:none!important;padding:8px 10px;color:var(--mut);cursor:grab;touch-action:none;font-size:18px}
.sw{width:44px;height:26px;border-radius:14px;background:var(--bd);position:relative;display:inline-block;flex:none}.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on2{background:var(--ac)}.sw.on2 i{left:21px}
.dr{display:flex!important;justify-content:space-between;align-items:center;color:var(--fg)}
#ed,.cht{caret-color:var(--ac)}
.ptr-box{text-align:center;font-size:12px;color:var(--mut);padding:4px 0;display:none}
@media print{header,.bar,#sh,#dim-ov{display:none!important}.desk{position:static!important;padding:0!important;background:#fff!important}.pg{box-shadow:none!important;border-radius:0!important;padding:0!important}}
</style></head><body><div id="dim-ov"></div><div id="app"></div><div id="sh" hidden></div>
<input type="file" id="imp" accept=".txt,.md,text/plain" hidden><input type="file" id="cov" accept="image/*" hidden><label id="hxl" style="position:fixed;left:-99px;top:0;opacity:0"><input type="checkbox" switch id="hx"></label>
<script>
const $=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem('hw')||'null')}catch(e){}
S=S||{items:[],set:{theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',font:"Merriweather,Georgia,serif",size:18,lh:1.8,ps:0,view:'grid',dim:0}};
if(S.set.v!=2){S.set.theme='light';S.set.v=2}
S.items=[];
let st;
const setStatus=txt=>{const b=$('#sync-st');if(b)b.textContent=txt};
const save=()=>{
  setStatus('Saving…');
  try{localStorage.setItem('hw',JSON.stringify({set:S.set}))}catch(e){}
  clearTimeout(st);
  st=setTimeout(()=>{
    if(window.sync){setStatus('Syncing…');window.sync()}else setStatus('Saved offline');
  },500);
};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const txt=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d.innerText||d.textContent||''};
const get=id=>S.items.find(i=>i.id==id);
const col=id=>['#e58fb0','#f0a58b','#c79ad8','#8fc3b0','#e7b95c','#b0587a'][[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%6];
let nav={v:'home'};

function ap(){
  const r=document.documentElement,s=S.set;
  r.dataset.theme=s.theme=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):s.theme;
  r.style.setProperty('--ef',s.font);
  r.style.setProperty('--sz',s.size+'px');
  r.style.setProperty('--lh',s.lh);
  r.style.setProperty('--ps',s.ps+'em');
  r.style.setProperty('--ind',(s.ind==null?1.6:s.ind)+'em');
  r.style.setProperty('--dim',s.dim||0);
}
function sheet(h){$('#sh').className='';$('#sh').innerHTML='<div class=bk onclick="cl()"></div><div class=bx>'+h+'</div>';$('#sh').hidden=false}
function cl(){$('#sh').hidden=true;$('#sh').innerHTML=''}
function ask(t,v,cb){sheet('<h3>'+t+'</h3><input type=text id=in value="'+esc(v)+'"><div class=row><button onclick="cl()">Cancel</button><button class=p id=ok>OK</button></div>');$('#in').focus();$('#ok').onclick=()=>{const x=$('#in').value.trim();cl();if(x)cb(x)}}

function R(){
  ap();
  document.body.classList.toggle('ed',nav.v=='edit');
  if(!S.set.w){welcome();return}
  if(window.U===undefined){$('#app').innerHTML='<p class=em>Loading…</p>';return}
  if(!window.U){login();return}
  if(nav.v!='edit'&&window.late){const s=window.late;window.late=null;if(!window.sync())window.apply(s)}
  ({home,bin,edit})[nav.v]();
  if(nav.v=='home')lpb();
}

const card=i=>{
  const t=i.type=='folder'?(i.tabs[0]||{}).c:i.c,f=i.type=='folder';
  return `<div class=cd data-id="${i.id}" style="--c:${col(i.id)}" onclick="opn('${i.id}')"><div class=pv style="${i.cover?`background:url('${i.cover}') center/cover`:''}">${i.cover?'':esc(txt(t).slice(0,160))}</div><div class=ct><span>${i.pin?'📌 ':''}${f?'':'📄 '}${esc(i.title)}${f?' · '+i.tabs.length+' tabs':''}</span><button onclick="event.stopPropagation();menu('${i.id}')">⋯</button></div></div>`;
};

function home(){
  const L=S.items.filter(i=>!i.del).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.up-a.up),g=S.set.view=='grid';
  $('#app').innerHTML=`<header><button onclick="sideMenu()">☰</button><h1>Hydee writes</h1><button onclick="S.set.view=S.set.view=='grid'?'list':'grid';save();R()">${g?'☰':'▦'}</button><button onclick="setn()">⚙️</button></header>
  <div id="ptr" class="ptr-box">Pull down to sync…</div>
  <div class="search-row"><input type="search" id="sq" placeholder="Search pieces and chapters…" enterkeyhint="search" onkeydown="if(event.key==='Enter')doSearch()"><button onclick="doSearch()">Search</button></div>
  <main id="lib" class="${g?'grid':'list'}">${L.map(card).join('')||'<p class=em style="grid-column:1/-1">Nothing here yet. Tap + to start writing.</p>'}</main>
  <button class=fab onclick="addm()">+</button>`;
  setupPullToSync();
}

function sideMenu(){
  sheet(`<h3>Hydee Menu</h3><button class=dr onclick="cl();nav={v:'bin'};R()"><span>🗑 Trash & Bin</span>›</button><button class=dr onclick="cl();setn()"><span>⚙️ Settings & Themes</span>›</button><button class=dr onclick="cl();window.sync&&window.sync();setStatus('Synced')"><span>🔄 Sync Now</span>›</button><button class=dr onclick="cl();inst()"><span>📲 Install App</span>›</button><button class=dr onclick="cl();out()"><span>🚪 Sign out</span>›</button>`);
  $('#sh').className='side';
}

function doSearch(){
  const q=($('#sq').value||'').trim().toLowerCase();
  document.querySelectorAll('.cd[data-id]').forEach(c=>{
    const i=get(c.dataset.id);if(!i)return;
    const mt=i.title.toLowerCase().includes(q)||(i.c&&txt(i.c).toLowerCase().includes(q))||(i.tabs&&i.tabs.some(t=>t.t.toLowerCase().includes(q)||txt(t.c).toLowerCase().includes(q)));
    c.style.display=mt?'':'none';
  });
}

function setupPullToSync(){
  let y0=0;const m=$('#lib'),p=$('#ptr');if(!m||!p)return;
  m.addEventListener('touchstart',e=>{y0=e.touches[0].clientY},{passive:true});
  m.addEventListener('touchmove',e=>{
    const dy=e.touches[0].clientY-y0;
    if(window.scrollY<=0&&dy>60){p.style.display='block';p.textContent='Release to sync ✨'}
  },{passive:true});
  m.addEventListener('touchend',()=>{
    if(p.style.display==='block'){
      p.textContent='Syncing…';
      if(window.sync)window.sync();
      setTimeout(()=>{p.style.display='none'},1000);
    }
  });
}

function addm(){sheet(`<h3>✨ What shall we create?</h3><div class=cr><button style="--a:#fde0ea;--b:#f9c6d8" onclick="cl();mk('doc')"><b>🌸 A fresh new piece</b><i>a blank page, ready for your words</i></button><button style="--a:#ede1fb;--b:#d9c6f4" onclick="cl();mk('folder')"><b>📚 A story folder</b><i>prologue, chapters &amp; a home for your novel</i></button><button style="--a:#dff3ea;--b:#c6e8d9" onclick="cl();$('#imp').click()"><b>💌 Bring in a file</b><i>a .txt or .md from your device</i></button></div>`)}

function mk(t){
  ask(t=='doc'?'Name your piece':'Name your folder','',n=>{
    const i={id:uid(),type:t,title:n,up:Date.now(),cr:Date.now(),log:[{at:Date.now(),e:'Created'}]};
    if(t=='doc')i.c='';
    else i.tabs=[{id:uid(),t:'Prologue',c:''},{id:uid(),t:'',c:''}];
    S.items.push(i);save();opn(i.id);
  });
}

$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const c=String(r.result).split(/\n+/).map(l=>'<p>'+esc(l)+'</p>').join('');const i={id:uid(),type:'doc',title:f.name.replace(/\.\w+$/,''),c,up:Date.now()};S.items.push(i);save();R()};r.readAsText(f);e.target.value=''};
function opn(id){const i=get(id);nav={v:'edit',id,tab:i.type=='folder'?i.tabs[0].id:null};R()}
function menu(id){const i=get(id),f=i.type=='folder';sheet(`<h3>${i.pin?'📌 ':''}${esc(i.title)}</h3><div class=mg>${[f?['➕','Add chapter','add']:0,['📚','Save as ePub','epub'],['📄','Save as Word','doc'],['📤','Send a copy','snd'],['📶','Available offline','off'],['✏️','Rename','rn'],['ℹ️','Details','det'],['🕘','Activity','act'],['📌',i.pin?'Unpin':'Pin','pin'],['📑','Duplicate','dup'],['🖼️',i.cover?'Change cover':'Add cover','cvr'],i.cover?['🧹','Remove cover','rcv']:0,['🗑️','Move to bin','dl2']].filter(Boolean).map(([e,l,k])=>`<button onclick="act('${k}','${id}')"><span>${e}</span>${l}</button>`).join('')}</div>`)}

function bin(){
  const now=Date.now(),L=S.items.filter(i=>i.del&&now-i.del<30*864e5);
  $('#app').innerHTML=`<header><button onclick="nav={v:'home'};R()">←</button><h1>Trash & Bin</h1></header><main><p class=em style="margin:0 0 10px">Items are permanently removed after 30 days.</p>${L.map(i=>`<div class=cd style="margin-bottom:8px"><div class=ct><span>${esc(i.title)} · ${Math.max(0,30-Math.floor((now-i.del)/864e5))} days left</span><span class=tb><button onclick="delete get('${i.id}').del;save();R()">Restore</button><button onclick="purgeBin('${i.id}')">Delete</button></span></div></div>`).join('')||'<p class=em>Bin is empty.</p>'}</main>`;
}
function purgeBin(id){S.items=S.items.filter(x=>x.id!=id);save();R()}

const ctt=t=>t.t||'';
const tn=(i,t)=>{const k=i.tabs.indexOf(t);return k===0?(t.t||'Prologue'):('Chapter '+k+(t.t?' · '+t.t:''))};
function cur(){const i=get(nav.id);return [i,i.type=='folder'?i.tabs.find(x=>x.id==nav.tab):i]}

function edit(){
  const [i,t]=cur(),f=i.type=='folder',k=f?i.tabs.indexOf(t):0,tabTitle=f?(k===0?'Prologue':'Chapter '+k):'';
  $('#app').innerHTML=`<header><button onclick="nav={v:'home'};R()">←</button><button onclick="drw()">☰</button>
  <button onpointerdown="event.preventDefault()" onclick="document.execCommand('undo')" title="Undo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a6 6 0 0 1 0 12h-3"/></svg></button>
  <button onpointerdown="event.preventDefault()" onclick="document.execCommand('redo')" title="Redo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a6 6 0 0 0 0 12h3"/></svg></button>
  <span class="sync-badge" id="sync-st">Saved</span><span class=sp></span>
  ${f?`<button onclick="tabs()">${esc(tabTitle)} ▾</button>`:''}
  <button onclick="fnd()">🔍</button><button onclick="setn()">Aa</button><button onclick="expo()">⬇</button></header>
